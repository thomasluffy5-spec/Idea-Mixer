<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantins 3D · Idea Mixer</title>
  <meta name="description" content="Pantins 3D articulés (humanoïde, quadrupède, formes simples) à poser, éclairer et exporter en PNG ou JPEG comme référence de dessin.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Cinzel:wght@600;800&family=Fredoka:wght@600&family=IM+Fell+English+SC&family=Orbitron:wght@700;800&family=Pirata+One&family=Rye&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/pose.css">

  <!-- Sans « defer » : applique le thème mémorisé avant l'affichage -->
  <script src="js/themes.js"></script>

  <!-- Three.js r147 (version « classique » : fonctionne aussi en ouvrant le fichier directement) -->
  <script src="js/vendor/three/three.min.js" defer></script>
  <script src="js/vendor/three/OrbitControls.js" defer></script>
  <script src="js/vendor/three/TransformControls.js" defer></script>
  <!-- Pantins : modèles → textes → application -->
  <script src="js/pose-data.js" defer></script>
  <script src="js/pose-i18n.js" defer></script>
  <script src="js/pose.js" defer></script>
</head>
<body class="pose-page">
  <div class="deco" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>

  <header class="top">
    <a class="logo" href="index.html">Idea Mixer</a>
    <nav aria-label="Navigation">
      <a href="index.html" data-t="nIdeas"></a>
      <a href="pose.html" data-t="nPose" aria-current="page"></a>
      <button class="lang" id="lang" type="button"></button>
    </nav>
  </header>

  <main class="pose-main">
    <h1 class="visually-hidden" data-t="title"></h1>

    <!-- Vue 3D (le canvas est ajouté par js/pose.js) -->
    <div class="stage" id="stage">
      <p class="stage-hint" data-t="stageHint"></p>
      <p class="stage-toast" id="toast" role="status" hidden></p>
    </div>

    <aside class="panel" aria-label="Outils">
      <section>
        <h2 data-t="pAdd"></h2>
        <div class="add-grid">
          <button type="button" class="tool" data-add="human"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 9.5l5 1.5 5-1.5M12 14l-3 7M12 14l3 7"/></svg><span data-t="human"></span></button>
          <button type="button" class="tool" data-add="quad"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11h11l3-3 2 1-1 3-2 1v7M6 11v8M9 11v8M16 13v6M5 11 3 8"/><circle cx="19.5" cy="8.5" r=".6"/></svg><span data-t="quad"></span></button>
          <button type="button" class="tool" data-add="box"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9"/></svg><span data-t="box"></span></button>
          <button type="button" class="tool" data-add="sphere"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3"/></svg><span data-t="sphere"></span></button>
          <button type="button" class="tool" data-add="cylinder"><svg aria-hidden="true" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="6" ry="2.5"/><path d="M6 5.5v13c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-13"/></svg><span data-t="cylinder"></span></button>
          <button type="button" class="tool" data-add="cone"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 5 18.5M12 3l7 15.5"/><ellipse cx="12" cy="18.5" rx="7" ry="2.5"/></svg><span data-t="cone"></span></button>
        </div>
      </section>

      <section id="selSection">
        <h2 data-t="pSel"></h2>
        <p class="sel-name" id="selName"></p>
        <div id="selTools">
          <div class="seg small" id="modes">
            <button type="button" data-mode="translate" title="W"><span data-t="move"></span></button>
            <button type="button" data-mode="rotate" title="E"><span data-t="rotate"></span></button>
            <button type="button" data-mode="scale" title="R"><span data-t="scale"></span></button>
          </div>
          <div class="row-btns">
            <button type="button" class="btn ghost sm" id="selWhole" data-t="whole"></button>
            <button type="button" class="btn ghost sm" id="selGround" data-t="toGround"></button>
            <button type="button" class="btn ghost sm" id="selDup" data-t="duplicate"></button>
            <button type="button" class="btn ghost sm" id="selDel" data-t="remove"></button>
          </div>
          <div id="poseTools">
            <label class="check"><input type="checkbox" id="mirror"> <span data-t="mirror"></span></label>
            <h3 data-t="poses"></h3>
            <div class="chip-row" id="poses"></div>
          </div>
        </div>
      </section>

      <section>
        <h2 data-t="pView"></h2>
        <div class="chip-row" id="views"></div>
        <h3 data-t="focal"></h3>
        <div class="seg small" id="fovs"></div>
      </section>

      <section>
        <h2 data-t="pLight"></h2>
        <label class="range"><span data-t="lightDir"></span><input type="range" id="lightAz" min="0" max="360" value="40"></label>
        <label class="range"><span data-t="lightHeight"></span><input type="range" id="lightEl" min="5" max="85" value="50"></label>
        <label class="check"><input type="checkbox" id="shadows" checked> <span data-t="shadows"></span></label>
      </section>

      <section>
        <h2 data-t="pExport"></h2>
        <h3 data-t="format"></h3>
        <div class="seg small" id="fmt">
          <button type="button" data-fmt="png">PNG</button>
          <button type="button" data-fmt="jpeg">JPEG</button>
        </div>
        <h3 data-t="bg"></h3>
        <div class="seg small" id="bgs">
          <button type="button" data-bg="transparent" data-t="bgTransparent"></button>
          <button type="button" data-bg="theme" data-t="bgTheme"></button>
          <button type="button" data-bg="white" data-t="bgWhite"></button>
        </div>
        <h3 data-t="size"></h3>
        <div class="seg small" id="scales">
          <button type="button" data-scale="1">×1</button>
          <button type="button" data-scale="2">×2</button>
          <button type="button" data-scale="4">×4</button>
        </div>
        <button type="button" class="btn" id="download" data-t="download"></button>
        <p class="note" data-t="exportNote"></p>
      </section>

      <section class="row-btns">
        <button type="button" class="btn ghost sm" id="undo" title="Ctrl+Z" data-t="undo"></button>
        <button type="button" class="btn ghost sm" id="clear" data-t="clear"></button>
      </section>
    </aside>
  </main>
</body>
</html>
